<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Tafel Rush – iframe-test</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f1ea; color: #222; margin: 0; padding: 24px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  .game { position: relative; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
  .game iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mijn website – Tafel Rush</h1>
  <p>Zo kun je de game insluiten. Klik in de game om te beginnen.</p>
  <div class="game">
    <iframe src="../index.html" title="Tafel Rush" allow="autoplay; fullscreen" loading="lazy"></iframe>
  </div>
  <p>Tekst onder de game. <input placeholder="Ander invoerveld op de pagina"></p>
</div>
</body>
</html>
